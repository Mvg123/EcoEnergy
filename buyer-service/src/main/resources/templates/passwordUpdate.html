<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>판매자 - 비밀번호 변경</title>
    <link rel="stylesheet" th:href="@{/buyer/css/style.css}">

    <style>
        /* style.css에 없는 '폼 전용' 스타일만 추가 */
        .form-container {
            max-width: 500px;
        }

        .form-group { margin-bottom: 25px; }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-dark);
            font-size: 0.95rem;
        }

        .form-input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.95rem;
            box-sizing: border-box;
            transition: all 0.2s;
            color: var(--text-dark);
        }

        .form-input:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        .form-input::placeholder { color: var(--text-light); }

        /* [수정] 헬퍼 텍스트 스타일 */
        .helper-text {
            font-size: 0.85rem;
            color: #adb5bd; /* 기본 회색 */
            margin-top: 8px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        /* [추가] 조건 충족 시 적용될 스타일 (녹색 + 굵게) */
        .helper-text span {
            transition: color 0.3s ease;
        }
        .helper-text span.valid {
            color: var(--success, #10b981); /* style.css 변수 사용, 없으면 녹색 */
            font-weight: bold;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }
        .btn-submit:hover { background-color: var(--primary-hover); }

        .alert {
            padding: 15px;
            margin-bottom: 25px;
            border-radius: 8px;
            text-align: center;
            font-size: 0.95rem;
            font-weight: 500;
        }
        .alert-danger {
            background-color: #fee2e2;
            color: var(--danger);
            border: 1px solid #fecaca;
        }
        .alert-success {
            background-color: #dcfce7;
            color: var(--success);
            border: 1px solid #bbf7d0;
        }
    </style>
</head>
<body>

<header th:replace="~{fragments/header :: header('profile')}"></header>

<div class="page-container">

    <aside th:replace="~{fragments/sidebar_mypage :: sidebar('password')}"></aside>

    <main class="main-content">
        <div class="header">
            <h1>🔒 비밀번호 변경</h1>
            <p>계정 보안을 위해 주기적으로 비밀번호를 변경해주세요.</p>
        </div>

        <div class="card form-container">

            <div th:if="${errorMsg}" class="alert alert-danger" th:text="${errorMsg}"></div>
            <div th:if="${msg}" class="alert alert-success" th:text="${msg}"></div>

            <form action="/buyer/updatePassword" method="post">
                <div class="form-group">
                    <label class="form-label">현재 비밀번호</label>
                    <input type="password" name="currentPassword" class="form-input" placeholder="현재 비밀번호를 입력해주세요" required>
                </div>

                <div class="form-group">
                    <label class="form-label">새 비밀번호</label>
                    <input type="password" id="newPassword" name="newPassword" class="form-input" placeholder="새 비밀번호를 입력해주세요" required>

                    <div class="helper-text">
                        <span id="rule-length">✔ 8-30자 이내</span>
                        <span id="rule-num">✔ 숫자 포함</span>
                        <span id="rule-eng">✔ 영문(대소문자) 포함</span>
                        <span id="rule-special">✔ 특수문자 포함</span>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">새 비밀번호 확인</label>
                    <input type="password" name="newPasswordCheck" class="form-input" placeholder="새 비밀번호를 한번 더 입력해주세요" required>
                </div>

                <button type="submit" class="btn-submit">비밀번호 변경</button>
            </form>
        </div>
    </main>
</div>

<script th:src="@{/buyer/js/passwordUpdate.js}"></script>
</body>
</html>
